  #wrap { max-width:520px; margin:0 auto; padding:80px 24px; text-align:center; line-height:1.8; }

  #wrap .spin { width:36px; height:36px; margin:28px auto 12px; border:4px solid #d9eef8; border-top-color:#1f2d5a; border-radius:50%; animation:r 1s linear infinite; }
  @keyframes r { to { transform:rotate(360deg); } }

  <span class="logo">wit.</span>
  <div class="spin"></div>

</div>
<div id="page"></div>
<script>
// ▼ ここだけ書き換えてください：予約ページのURL（「設定」シートの予約ページURL・/exec で終わるもの）
var GAS_URL = 'https://script.google.com/macros/s/AKfycbwZLzXJiH1w4DNGMSxVDWAyw-tThcHSZHNekVnXuSric2L1J0luhr0ZZ0EHAriT8bD7/exec';
// ▲
// LINEを使わない方の入口
// ===== 予約ページをGoogleから文字で受け取り、このページに表示する =====
// （Googleのログイン状態に関係なく開けるように。Googleのクッキーは送らない）
function callGas(fn, args) {
  return fetch(GAS_URL, { method: 'POST', credentials: 'omit', body: JSON.stringify({ action: 'run', fn: fn, args: args }) })
    .then(function (r) { return r.json(); })
    .then(function (res) { if (!res || !res.ok) throw new Error((res && res.msg) || 'error'); return res.result; });
}
// 予約ページの中の google.script.run を、上の callGas に置きかえる
function makeRun() {
  var ok = null, ng = null, p, o = {
    withSuccessHandler: function (f) { ok = f; return p; },
    withFailureHandler: function (f) { ng = f; return p; },
  };
  p = new Proxy(o, { get: function (t, k) {
    if (k in t) return t[k];
    return function () {
      callGas(String(k), Array.prototype.slice.call(arguments))
        .then(function (r) { if (ok) ok(r); }, function (e) { if (ng) ng(e); });
    };
  } });
  return p;
}
window.google = { script: { get run() { return makeRun(); } } };
function loadPage(query) {
  return fetch(GAS_URL + '?raw=1' + (query ? '&' + query : ''), { credentials: 'omit' })
    .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.text(); })
    .then(function (html) {
      if (html.indexOf('class="wrap"') < 0) throw new Error('bad page');
      var box = document.getElementById('page');
      box.innerHTML = html;
      var list = box.querySelectorAll('script');
      for (var i = 0; i < list.length; i++) {
        var n = document.createElement('script');
        n.text = list[i].text;
        list[i].parentNode.replaceChild(n, list[i]);
      }
      document.getElementById('wrap').style.display = 'none';
    });
}
