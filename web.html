<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wit. ご予約</title>
<style>
  html, body { margin:0; height:100%; background:#fdfcf8; color:#1f2d5a; font-family:'Hiragino Maru Gothic ProN','Hiragino Sans',sans-serif; }
  .wrap { max-width:520px; margin:0 auto; padding:80px 24px; text-align:center; line-height:1.8; }
  .logo { display:inline-block; color:#8a5a3c; font-weight:800; font-size:22px; border:2px solid #8fcbe6; border-radius:10px; padding:2px 12px; background:#fff; }
  .spin { width:36px; height:36px; margin:28px auto 12px; border:4px solid #d9eef8; border-top-color:#1f2d5a; border-radius:50%; animation:r 1s linear infinite; }
  @keyframes r { to { transform:rotate(360deg); } }
  iframe { position:fixed; inset:0; width:100%; height:100%; border:0; background:#fdfcf8; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <span class="logo">wit.</span>
  <div class="spin"></div>
  <p>読み込み中です…</p>
</div>
<script>
// ▼ ここだけ書き換えてください：予約ページのURL（「設定」シートの予約ページURL・/exec で終わるもの）
var GAS_URL = 'https://script.google.com/macros/s/AKfycbwZLzXJiH1w4DNGMSxVDWAyw-tThcHSZHNekVnXuSric2L1J0luhr0ZZ0EHAriT8bD7/exec';
// ▲
// LINEを使わない方の入口。予約ページをこの中に表示する（Googleのアカウントが複数あっても開けるように）
var f = document.createElement('iframe');
f.src = GAS_URL + location.search;
f.setAttribute('allow', 'payment');
f.addEventListener('load', function () { document.getElementById('wrap').style.display = 'none'; });
document.body.appendChild(f);
window.addEventListener('message', function (e) { if (e.data === 'wit-reload') location.reload(); });
</script>
</body>
</html>
